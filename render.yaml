services:
  - type: web
    name: nuvio-sports-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_TTL_MS
        value: "60000"
